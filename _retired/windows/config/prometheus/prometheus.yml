global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'homelab-ops-mesh'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Pi scrape targets — update these if Pi's Tailscale IP changes
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['100.64.0.1:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['100.64.0.1:8083']

  - job_name: 'traefik'
    static_configs:
      - targets: ['100.64.0.1:8084']

  - job_name: 'pihole-exporter'
    static_configs:
      - targets: ['100.64.0.1:9617']

  - job_name: 'headscale'
    static_configs:
      - targets: ['100.64.0.1:9092']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']