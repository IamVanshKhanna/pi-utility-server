global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'homelab-ops-mesh'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'loki'
    static_configs:
      - targets: ['100.127.191.2:3100']

  - job_name: 'promtail'
    static_configs:
      - targets: ['100.127.191.2:9080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['100.127.191.2:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['100.127.191.2:8080']

  - job_name: 'traefik'
    static_configs:
      - targets: ['100.127.191.2:8082']

  - job_name: 'pihole-exporter'
    static_configs:
      - targets: ['100.127.191.2:9617']