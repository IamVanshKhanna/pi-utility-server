# STACK: SECRETS (Windows)
# Services: Infisical + Postgres + Redis
# Access via Pi Traefik: https://autobot.taila24d04.ts.net/secrets/

networks:
  proxy:
    name: homelab_win
    driver: bridge

volumes:
  infisical-db-data:
  infisical-redis-data:

services:
  infisical-db:
    image: postgres:16.14-alpine
    container_name: infisical-db-win
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_POSTGRES_PASSWORD}
    volumes:
      - infisical-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - proxy
    mem_limit: 512m
    cpus: 0.5

  infisical-redis:
    image: redis:7.4-alpine
    container_name: infisical-redis-win
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${INFISICAL_REDIS_PASSWORD}
    volumes:
      - infisical-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${INFISICAL_REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - proxy
    mem_limit: 256m
    cpus: 0.25

  infisical:
    image: infisical/infisical:v0.161.5
    container_name: infisical-win
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_POSTGRES_PASSWORD}@infisical-db-win:5432/infisical
      REDIS_URL: redis://:${INFISICAL_REDIS_PASSWORD}@infisical-redis-win:6379
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      SITE_URL: https://autobot.taila24d04.ts.net/secrets
      TRUSTED_PROXIES: "*"
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy
    mem_limit: 512m
    cpus: 1.0
