# STACK: MONITORING (Windows)
# Services: Grafana + Prometheus + Alertmanager
# Access via Pi Traefik: https://autobot.taila24d04.ts.net/grafana/

networks:
  proxy:
    name: homelab_win
    driver: bridge

volumes:
  grafana_data:
  prometheus_data:
  alertmanager_data:

services:
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana-win
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - proxy
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://autobot.taila24d04.ts.net/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=${TZ:-Australia/Melbourne}
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus-win
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "9090:9090"
    volumes:
      - ../../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager-win
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "9093:9093"
    volumes:
      - ../../config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    mem_limit: 64m
