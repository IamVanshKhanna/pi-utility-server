# STACK: AUTH (Windows)
# Services: Authelia SSO + Redis
# Access via Pi Traefik: https://autobot.taila24d04.ts.net/auth/

networks:
  proxy:
    name: homelab_win
    external: true

volumes:
  authelia_data:
  authelia_redis:

services:
  authelia:
    image: authelia/authelia:4.38.0
    container_name: authelia-win
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - proxy
    volumes:
      - ../../config/authelia/configuration.yml:/config/configuration.yml:ro
      - ../../config/authelia/users_database.yml:/config/users_database.yml:ro
      - authelia_data:/data
    environment:
      - TZ=${TZ}
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - authelia-redis

  authelia-redis:
    image: redis:7.4-alpine
    container_name: authelia-redis-win
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    volumes:
      - authelia_redis:/data
    command: redis-server --requirepass ${AUTHELIA_REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 64m
    cpus: 0.1
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$AUTHELIA_REDIS_PASSWORD redis-cli ping"]
      interval: 15s
      timeout: 5s
      retries: 5
