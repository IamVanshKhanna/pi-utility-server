name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shopt -s globstar nullglob
          shellcheck -S warning pi/scripts/*.sh pi/stacks/**/*.sh

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dummy env file
        run: |
          grep -v '^\s*#' pi/.env.example | grep -v '^\s*$' | \
            sed -E 's/=(\s*)$/=ci-dummy/' > /tmp/ci.env
      - name: Validate compose files
        run: |
          set -e
          for f in pi/stacks/*/docker-compose.yml; do
            echo "== $f"
            docker compose --env-file /tmp/ci.env -f "$f" config --quiet
          done
