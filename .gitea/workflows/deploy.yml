name: Deploy Homelab
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: pi
    env:
      PI_ENV_FILE: /home/vansh/.secrets/pi-utility-server.env
    steps:
      - name: Pull latest into live repo
        run: |
          cd /mnt/nas/02. shared/01. PI Files/01. pi-utility-server
          git fetch gitea || exit 1
          git reset --hard gitea/main || exit 1

      - name: Validate shell scripts
        run: |
          cd /mnt/nas/02. shared/01. PI Files/01. pi-utility-server
          for f in pi/scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "shell syntax OK"

      - name: Validate compose files
        run: |
          cd /mnt/nas/02. shared/01. PI Files/01. pi-utility-server
          for d in pi/stacks/*/; do
            (cd "$d" && docker compose --env-file "$PI_ENV_FILE" config --quiet) || exit 1
          done
          echo "compose config OK"

      - name: Deploy stacks
        run: |
          cd /mnt/nas/02. shared/01. PI Files/01. pi-utility-server
          bash pi/scripts/update.sh

      - name: Health check
        run: |
          cd /mnt/nas/02. shared/01. PI Files/01. pi-utility-server
          bash pi/scripts/health-check.sh --strict

      - name: Notify on failure
        if: failure()
        run: |
          load_env() {
            local f="$1"
            while IFS='=' read -r key val; do
              [[ -z "$key" || "$key" == \#* ]] && continue
              val="${val#\"}" val="${val%\"}"
              val="${val#\'}" val="${val%\'}"
              export "$key=$val"
            done < "$f"
          }
          load_env "$PI_ENV_FILE"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ <b>Deploy failed</b> on $(hostname) at $(date '+%Y-%m-%d %H:%M:%S')" \
            -d parse_mode="HTML" >/dev/null 2>&1 || true
