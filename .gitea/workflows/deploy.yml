name: Validate Homelab
on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: pi
    env:
      PI_ENV_FILE: /home/vansh/.secrets/pi-utility-server.env
    steps:
      - name: Validate shell scripts
        run: |
          cd "/mnt/nas/02. shared/01. PI Files/01. pi-utility-server"
          for f in pi/scripts/*.sh; do bash -n "$f" || exit 1; done

      - name: Validate compose files
        run: |
          cd "/mnt/nas/02. shared/01. PI Files/01. pi-utility-server"
          for d in pi/stacks/*/; do
            (cd "$d" && docker compose --env-file "$PI_ENV_FILE" config --quiet) || exit 1
          done

      - name: Health check
        run: |
          cd "/mnt/nas/02. shared/01. PI Files/01. pi-utility-server"
          bash pi/scripts/health-check.sh
