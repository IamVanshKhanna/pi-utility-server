name: Deploy Homelab
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: pi
    steps:
      - name: Pull latest changes
        run: |
          cd /home/vansh/homelab-ops-mesh
          git remote add gitea http://127.0.0.1:8087/vansh/homelab-ops-mesh.git 2>/dev/null || true
          git fetch gitea
          git checkout main
          git reset --hard gitea/main

      - name: Validate compose files
        run: |
          cd /home/vansh/homelab-ops-mesh
          for f in pi/stacks/*/docker-compose.yml; do
            docker compose -f "$f" --env-file .env config --quiet || exit 1
          done

      - name: Render dynamic.yml
        run: |
          cd /home/vansh/homelab-ops-mesh
          bash pi/scripts/render-dynamic-yml.sh

      - name: Deploy stacks
        run: |
          cd /home/vansh/homelab-ops-mesh
          bash pi/scripts/update.sh

      - name: Health check
        run: |
          cd /home/vansh/homelab-ops-mesh
          bash pi/scripts/health-check.sh --strict

      - name: Notify on failure
        if: failure()
        run: |
          cd /home/vansh/homelab-ops-mesh
          load_env() {
            local f="$1"
            while IFS='=' read -r key val; do
              [[ -z "$key" || "$key" == \#* ]] && continue
              val="${val#\"}" val="${val%\"}"
              val="${val#\'}" val="${val%\'}"
              export "$key=$val"
            done < "$f"
          }
          load_env .env
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ <b>Deploy failed</b> on $(hostname) at $(date '+%Y-%m-%d %H:%M:%S')" \
            -d parse_mode="HTML" >/dev/null 2>&1 || true
