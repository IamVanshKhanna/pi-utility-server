# STACK: HEADSCALE
# Self-hosted Tailscale control server (replaces Tailscale SaaS)
# Public URL: http://203.123.106.92:8086 (port forward required on router)
# Embedded DERP/STUN listener published on 3478/udp for direct-connect
# negotiation (see ADR-007).
# Image: https://github.com/juanfont/headscale/pkgs/container/headscale

volumes:
  headscale_lib:

services:
  headscale:
    image: headscale/headscale:v0.29.1
    container_name: headscale
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    command: serve
    read_only: true
    tmpfs:
      - /var/run/headscale
    volumes:
      - ../../config/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ../../config/headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - headscale_lib:/var/lib/headscale
    ports:
      - "0.0.0.0:8086:8080"
      - "127.0.0.1:9092:9090"
      - "0.0.0.0:3478:3478/udp"
    environment:
      - TZ=${TZ:-Australia/Melbourne}
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, headscale, health]
      interval: 30s
      timeout: 10s
      retries: 3
