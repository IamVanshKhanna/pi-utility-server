# STACK: CROWDSEC — Intrusion Detection
# https://docs.crowdsec.net/
# Deploy for log parsing and threat intelligence

networks:
  proxy:
    external: true

volumes:
  crowdsec_data:
  crowdsec_config:

services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: crowdsec
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - ../../config/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ../../config/crowdsec/notifications:/etc/crowdsec/notifications
      - /var/log:/var/log/host:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      - TZ=${TZ}
      - CROWDSEC_AGENCY_KEY=${CROWDSEC_API_KEY:-}
    mem_limit: 256m
    cpus: 0.5
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    depends_on:
      - relay

  relay:
    image: python:3-alpine
    container_name: crowdsec-relay
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../../config/crowdsec/webhook-relay:/relay:ro
    command: python /relay/relay.py
    environment:
      - ALERTMANAGER_URL=http://100.74.111.26:9093/api/v1/alerts
      - PYTHONUNBUFFERED=1
    mem_limit: 64m
    cpus: 0.1
