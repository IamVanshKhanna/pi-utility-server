# STACK: CROWDSEC — Intrusion Detection
# https://docs.crowdsec.net/
# Deploy for log parsing and threat intelligence

networks:
  proxy:
    external: true

volumes:
  crowdsec_data:
  crowdsec_config:

services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: crowdsec
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - ../../config/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ../../config/crowdsec/http.yaml:/etc/crowdsec/notifications/http.yaml:ro
      - /var/log:/var/log/host:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      - TZ=${TZ}
      - CROWDSEC_AGENCY_KEY=${CROWDSEC_API_KEY:-}
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
    cap_add:
      - NET_ADMIN
    depends_on:
      - relay

  relay:
    image: python:3.12-alpine
    container_name: crowdsec-relay
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - ../../config/crowdsec/webhook-relay:/relay:ro
    command: python /relay/relay.py
    environment:
      - ALERTMANAGER_URL=http://${WINDOWS_IP:-100.64.0.2}:9093/api/v1/alerts
      - RELAY_TOKEN=${RELAY_TOKEN}
      - PYTHONUNBUFFERED=1
    mem_limit: 64m
    cpus: 0.1
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8085)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
