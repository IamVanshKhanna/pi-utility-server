# STACK: APPS
# Services: Vaultwarden

networks:
  proxy:
    external: true

volumes:
  vaultwarden_data:

services:

  vaultwarden:
# pinned-from: vaultwarden/server:1.32.0
    image: vaultwarden/server@sha256:71668d20d4208d70919cf8cb3caf3071d41ed4b7d95afe71125ccad8408b040d
    container_name: vaultwarden
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "100.84.60.109:8081:80"
    networks:
      - proxy
    volumes:
      - vaultwarden_data:/data
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - DOMAIN=${DOMAIN}
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - TZ=${TZ}
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden-apps.rule=PathPrefix(`/vault`)"
      - "traefik.http.routers.vaultwarden-apps.entrypoints=web"
      - "traefik.http.routers.vaultwarden-apps.middlewares=strip-vault-apps"
      - "traefik.http.middlewares.strip-vault-apps.stripprefix.prefixes=/vault"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
