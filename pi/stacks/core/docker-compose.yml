# STACK: CORE
# Services: Traefik (reverse proxy + TLS) + Portainer (Docker UI)
# Deploy FIRST before any other stack.

networks:
  proxy:
    external: true

volumes:
  portainer_data:

services:

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../config/traefik/traefik.yml:/traefik.yml:ro
      - ../../config/traefik/dynamic.yml:/dynamic.yml:ro
      - ../../config/traefik:/config:ro
    environment:
      - TZ=${TZ}
    mem_limit: 128m
    cpus: 0.5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      - "traefik.http.routers.traefik.entrypoints=tailscale"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=basic-auth@file,strip-traefik-dashboard"
      - "traefik.http.middlewares.strip-traefik-dashboard.stripprefix.prefixes=/dashboard,/api"

  portainer:
    # Pin to specific version - update manually after testing
    # Check latest: https://github.com/portainer/portainer/releases
    image: portainer/portainer-ce:2.21.0
    container_name: portainer
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    mem_limit: 256m
    cpus: 0.5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=PathPrefix(`/portainer`)"
      - "traefik.http.routers.portainer.entrypoints=tailscale"
      - "traefik.http.routers.portainer.middlewares=strip-portainer"
      - "traefik.http.middlewares.strip-portainer.stripprefix.prefixes=/portainer"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
