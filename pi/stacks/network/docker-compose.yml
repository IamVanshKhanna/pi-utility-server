# STACK: NETWORK
# Services: Pi-hole v6 (DNS ad-blocking) + unbound (DoT upstream forwarder)
# DNS path: clients -> Pi-hole (ad-block + DNSSEC) -> unbound 127.0.0.1#5053 -> DoT/TLS -> 1.1.1.1/8.8.8.8
# WireGuard removed: host-level WG + Tailscale cover VPN needs; Docker WG
# conflicts on port 51820/udp.
# IMPORTANT: Disable systemd-resolved first:
#   sudo systemctl disable --now systemd-resolved
# pihole-exporter removed 2026-08-07: Prometheus/Loki stack retired (ADR-009);
# Beszel (monitoring stack) is the replacement metrics tool.

networks:
  proxy:
    external: true

volumes:
  pihole_data:
  pihole_dnsmasq:

services:

  unbound:
    build: ./unbound
    image: local/unbound:alpine3.24
    container_name: unbound
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../../config/unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    ports:
      - "127.0.0.1:5053:5053/udp"
      - "127.0.0.1:5053:5053/tcp"
    mem_limit: 48m
    cpus: 0.1
    healthcheck:
      test: ["CMD-SHELL", "unbound-control status | grep -q 'version:' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pihole:
# pinned-from: pihole/pihole:2026.07.2
    image: pihole/pihole@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    container_name: pihole
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
      - ../../config/pihole/custom.list:/etc/pihole/custom.list:ro
    environment:
      - TZ=${TZ}
      - FTLCONF_webserver_api_password=${PIHOLE_WEBPASSWORD}
      - FTLCONF_dns_upstreams=127.0.0.1#5053
      - FTLCONF_dns_dnssec=true
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_webserver_port=8053
      - FTLCONF_webserver_tls_enabled=false
      - FTLCONF_misc_etc_dnsmasq_d=true
    cap_add:
      - NET_ADMIN
    mem_limit: 256m
    cpus: 0.25
    depends_on:
      unbound:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "dig +short localhost @127.0.0.1 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
