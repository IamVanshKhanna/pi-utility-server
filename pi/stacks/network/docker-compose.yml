# STACK: NETWORK
# Services: Pi-hole (DNS ad-blocking)
# WireGuard removed: host-level WG + Tailscale cover VPN needs; Docker WG
# conflicts on port 51820/udp.
# IMPORTANT: Disable systemd-resolved first:
#   sudo systemctl disable --now systemd-resolved

networks:
  proxy:
    external: true

volumes:
  pihole_data:
  pihole_dnsmasq:

services:

  pihole:
    # Check latest: https://github.com/pi-hole/docker-pi-hole/releases
    image: pihole/pihole:2024.07.0
    container_name: pihole
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
      - ../../config/pihole/custom.list:/etc/pihole/custom.list:ro
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
      - PIHOLE_DNS_=${PIHOLE_DNS1};${PIHOLE_DNS2}
      - DNSMASQ_LISTENING=all
      - WEB_PORT=8053
    cap_add:
      - NET_ADMIN
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "pihole-FTL", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  pihole-exporter:
    # Check latest: https://github.com/eko/pihole-exporter/releases
    # Uses proxy network + host-gateway to reach Pi-hole (which runs in host mode)
    image: ekofr/pihole-exporter:v1.0.1
    container_name: pihole-exporter
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PIHOLE_HOSTNAME=host.docker.internal
      - PIHOLE_PASSWORD=${PIHOLE_WEBPASSWORD}
      - PIHOLE_PORT=8053
      - PORT=9617
    ports:
      - "9617:9617"
    mem_limit: 32m
    cpus: 0.05
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9617/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
