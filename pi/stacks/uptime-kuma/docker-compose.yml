# STACK: UPTIME-KUMA

networks:
  proxy:
    external: true

volumes:
  uptime_kuma_data:

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.9
    container_name: uptime-kuma
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8082:3001"
    networks:
      - proxy
    volumes:
      - uptime_kuma_data:/app/data
    mem_limit: 192m
    cpus: 0.25
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=PathPrefix(`/uptime`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=tailscale"
      - "traefik.http.routers.uptime-kuma.middlewares=strip-uptime"
      - "traefik.http.middlewares.strip-uptime.stripprefix.prefixes=/uptime"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
