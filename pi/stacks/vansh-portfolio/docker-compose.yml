# STACK: VANSH-PORTFOLIO
# Personal portfolio site (Astro). Source vendored into this repo (./app)
# so builds are reproducible without the old absolute path (see ADR-010).

networks:
  proxy:
    external: true

services:
  vansh-portfolio:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: vansh-portfolio
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    ports:
      - "100.84.60.109:8091:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 32m
    cpus: 0.25
