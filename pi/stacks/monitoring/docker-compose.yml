# STACK: MONITORING v1.1
# Services: Node Exporter + cAdvisor + Promtail
# Prometheus, Alertmanager, Loki, Grafana migrated to Windows (homelab-ops-mesh)
# Gives full visibility into Pi hardware, containers, and sends logs to Windows Loki.

networks:
  proxy:
    external: true

services:
  promtail:
    # Check latest: https://hub.docker.com/r/grafana/promtail/tags
    image: grafana/promtail:2.9.0
    container_name: promtail
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../config/promtail/promtail.yml:/etc/promtail/config.yml:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
      - '-client.url=http://${WINDOWS_IP:-100.74.111.26}:3100/loki/api/v1/push'
    mem_limit: 96m
    cpus: 0.1
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9080'"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    # Check latest: https://hub.docker.com/r/prom/node-exporter/tags
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    mem_limit: 32m
    cpus: 0.1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  cadvisor:
    # Check latest: https://github.com/google/cadvisor/releases
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3