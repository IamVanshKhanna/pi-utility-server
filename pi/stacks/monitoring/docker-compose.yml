# STACK: MONITORING v3
# Service: Beszel ??? lightweight system monitoring (hub + agent)
# Replaces Netdata (v2) which used ~177MB RAM + 1.26GB image.
# Hub bound to Tailscale IP (mesh only); agent uses host networking and a
# shared unix socket for the local system.
# First-run admin is auto-created from BESZEL_EMAIL / BESZEL_PASSWORD.
# Agent auto-registers using the universal token (BESZEL_UNIVERSAL_TOKEN).

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8092:8090"
      - "100.84.60.109:8092:8090"
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - USER_EMAIL=${BESZEL_EMAIL}
      - USER_PASSWORD=${BESZEL_PASSWORD}
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    mem_limit: 128m
    cpus: 0.25

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    environment:
      - KEY=${BESZEL_HUB_KEY}
      - TOKEN=${BESZEL_UNIVERSAL_TOKEN}
      - HUB_URL=http://localhost:8092
      - LISTEN=/beszel_socket/beszel.sock
    volumes:
      - beszel_socket:/beszel_socket
    mem_limit: 64m
    cpus: 0.1

volumes:
  beszel_data:
  beszel_socket:
