# STACK: MONITORING v3
# Service: Beszel -- lightweight system monitoring (hub + agent)
# Replaces Netdata (v2) which used ~177MB RAM + 1.26GB image. See ADR-010.
# Hub bound to loopback + mesh IP (mesh only); agent uses host networking and
# a shared unix socket for the local system.
# First-run admin is auto-created from BESZEL_EMAIL / BESZEL_PASSWORD.
# Agent auto-registers using the universal token (BESZEL_UNIVERSAL_TOKEN).
# Images pinned to 0.18.7 (ADR-010).

services:
  beszel:
# pinned-from: henrygd/beszel:0.18.7
    image: henrygd/beszel@sha256:a849ad80814b6a1a3be665304dcace5d4854b3bed7bde4dd1227e8ce1b82d477
    container_name: beszel
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8092:8090"
      - "100.84.60.109:8092:8090"
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - USER_EMAIL=${BESZEL_EMAIL}
      - USER_PASSWORD=${BESZEL_PASSWORD}
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    mem_limit: 128m
    cpus: 0.25

  beszel-agent:
# pinned-from: henrygd/beszel-agent:0.18.7
    image: henrygd/beszel-agent@sha256:8874e2c53f9de5e063a6a80d6b617e20fa593ac5dc4eb4c6ce1f912f510f38f8
    container_name: beszel-agent
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    environment:
      - KEY=${BESZEL_HUB_KEY}
      - TOKEN=${BESZEL_UNIVERSAL_TOKEN}
      - HUB_URL=http://localhost:8092
      - LISTEN=/beszel_socket/beszel.sock
    volumes:
      - beszel_socket:/beszel_socket
    mem_limit: 64m
    cpus: 0.1

volumes:
  beszel_data:
  beszel_socket:
