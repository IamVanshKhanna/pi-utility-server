# STACK: MONITORING v1.1
# Services: Grafana + Node Exporter + cAdvisor + Promtail
# Prometheus + Alertmanager + Loki migrated to Windows (homelab-ops-mesh)
# Gives full visibility into Pi hardware, containers, and sends logs to Windows Loki.

networks:
  proxy:
    external: true

volumes:
  grafana_data:

services:
  promtail:
    # Check latest: https://hub.docker.com/r/grafana/promtail/tags
    image: grafana/promtail:2.9.0
    container_name: promtail
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../config/promtail/promtail.yml:/etc/promtail/config.yml:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
    mem_limit: 64m
    cpus: 0.1

  grafana:
    # Check latest: https://hub.docker.com/r/grafana/grafana/tags
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://autobot.taila24d04.ts.net/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=${TZ}
    mem_limit: 256m
    cpus: 0.5
    labels:
      - "traefik.enable=false"

  node-exporter:
    # Check latest: https://hub.docker.com/r/prom/node-exporter/tags
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    mem_limit: 64m
    cpus: 0.1

  cadvisor:
    # Check latest: https://github.com/google/cadvisor/releases
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    mem_limit: 128m
    cpus: 0.25