networks:
  proxy:
    external: true

services:
  portfolio:
    build:
      context: ../../../portfolio
      dockerfile: Dockerfile
    container_name: portfolio
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    expose:
      - "8080"
    mem_limit: 32m
    cpus: 0.25
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=PathPrefix(`/`)"
      - "traefik.http.routers.portfolio.entrypoints=tailscale"
      - "traefik.http.routers.portfolio.priority=1"
      - "traefik.http.services.portfolio.loadbalancer.server.port=8080"
