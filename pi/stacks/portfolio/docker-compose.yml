networks:
  proxy:
    external: true

services:
  portfolio:
    build:
      context: ../../../portfolio
      dockerfile: Dockerfile
    container_name: portfolio
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    ports:
      - "100.64.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 32m
    cpus: 0.25
