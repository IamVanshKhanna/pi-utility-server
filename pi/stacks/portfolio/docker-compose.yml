networks:
  proxy:
    external: true

services:
  portfolio:
    build:
      context: ../../../portfolio
      dockerfile: Dockerfile
    container_name: portfolio
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - "8080"
    mem_limit: 64m
    cpus: 0.25
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`portfolio.${DOMAIN}`)"
      - "traefik.http.routers.portfolio.entrypoints=tailscale"
      - "traefik.http.services.portfolio.loadbalancer.server.port=8080"
