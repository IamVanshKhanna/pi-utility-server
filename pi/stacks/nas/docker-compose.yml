# STACK: NAS - Samba + Syncthing
# Local network file storage for the homelab
# Access via SMB (\\autobot\shared)
# samba: proper image (alpine + samba baked), config version-controlled at
# config/samba/smb.conf, password set once into the config volume (not reset
# on every start). Exposure restricted via DOCKER-USER firewall to LAN + Tailscale.

networks:
  proxy:
    external: true

volumes:
  samba_config:
  syncthing_data:

services:
  samba:
    build: ./samba
    image: local/samba:alpine3.24
    container_name: samba
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    ports:
      - "445:445"
    volumes:
      - /mnt/nas:/mnt/nas:rw
      - samba_config:/etc/samba
      - ../../config/samba/smb.conf:/etc/samba/smb.conf:ro
    mem_limit: 128m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "pgrep", "smbd"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=false"


  syncthing:
# pinned-from: syncthing/syncthing:2.1.1
    image: syncthing/syncthing@sha256:775c4aac486263ca8653055bba7d3061799281974b706695e17bc798da3f4e92
    container_name: syncthing
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8384:8384"
      - "100.84.60.109:22000:22000/tcp"
    volumes:
      - syncthing_data:/var/syncthing
      - "/mnt/nas/01. sync:/data/sync:rw"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8384/rest/noauth/health"]
      interval: 60s
      timeout: 10s
      retries: 3
