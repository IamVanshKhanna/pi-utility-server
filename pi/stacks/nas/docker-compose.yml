# STACK: NAS - Samba + Syncthing
# Local network file storage for the homelab
# Access via SMB (\\autobot\shared)

networks:
  proxy:
    external: true

volumes:
  samba_config:
  syncthing_data:

services:
  samba:
    image: alpine:latest
    container_name: samba
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - /mnt/nas/shared:/mnt/shared:rw
      - /mnt/nas/media:/mnt/media:rw
      - /mnt/nas/backup:/mnt/backup:rw
      - samba_config:/etc/samba
    command: >
      sh -c "
        apk add --no-cache samba &&
        echo -e '[global]\nworkgroup = HOMELAB\nsecurity = user\nmap to guest = bad user\n' > /etc/samba/smb.conf &&
        echo -e '[shared]\npath = /mnt/shared\nbrowseable = yes\nread only = no\nguest ok = yes\nforce user = root\nforce group = root' >> /etc/samba/smb.conf &&
        echo -e '[media]\npath = /mnt/media\nbrowseable = yes\nread only = no\nguest ok = yes\nforce user = root\nforce group = root' >> /etc/samba/smb.conf &&
        echo -e '[backup]\npath = /mnt/backup\nbrowseable = yes\nread only = no\nguest ok = yes\nforce user = root\nforce group = root' >> /etc/samba/smb.conf &&
        addgroup -g ${PGID:-1000} vansh &&
        adduser -u ${PUID:-1000} -G vansh -D -H -s /bin/false vansh &&
        echo -e '${SAMBA_PASSWORD:-changeme}\n${SAMBA_PASSWORD:-changeme}' | smbpasswd -a -s vansh &&
        smbd -F -d 2
      "
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SAMBA_PASSWORD=${SAMBA_PASSWORD:-changeme}
    mem_limit: 256m
    cpus: 0.5
    labels:
      - "traefik.enable=false"


  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "8384:8384"
      - "22000:22000"
      - "21027:21027/udp"
    volumes:
      - syncthing_data:/var/syncthing
      - /mnt/nas/sync:/data/sync:rw
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    mem_limit: 128m
    cpus: 0.25
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.syncthing.rule=PathPrefix(`/sync`)"
      - "traefik.http.routers.syncthing.entrypoints=tailscale"
      - "traefik.http.routers.syncthing.middlewares=strip-sync"
      - "traefik.http.middlewares.strip-sync.stripprefix.prefixes=/sync"
      - "traefik.http.services.syncthing.loadbalancer.server.port=8384"
