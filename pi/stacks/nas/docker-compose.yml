# STACK: NAS - Samba + Syncthing
# Local network file storage for the homelab
# Access via SMB (\\autobot\shared)

networks:
  proxy:
    external: true

volumes:
  samba_config:
  syncthing_data:

services:
  samba:
    image: alpine:3.24
    container_name: samba
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - /mnt/nas/shared:/mnt/shared:rw
      - /mnt/nas/media:/mnt/media:rw
      - /mnt/nas/backup:/mnt/backup:rw
      - samba_config:/etc/samba
    command: >
      sh -c "
        apk add --no-cache samba &&
        echo -e '[global]\nworkgroup = HOMELAB\nsecurity = user\nmap to guest = bad user\n' > /etc/samba/smb.conf &&
        echo -e '[shared]\npath = /mnt/shared\nbrowseable = yes\nread only = no' >> /etc/samba/smb.conf &&
        echo -e '[media]\npath = /mnt/media\nbrowseable = yes\nread only = yes\nguest ok = yes\nforce user = nobody' >> /etc/samba/smb.conf &&
        echo -e '[backup]\npath = /mnt/backup\nbrowseable = yes\nread only = no' >> /etc/samba/smb.conf &&
        addgroup -g ${PGID:-1000} vansh 2>/dev/null || true &&
        adduser -u ${PUID:-1000} -G vansh -D -H -s /bin/false vansh 2>/dev/null || true &&
        echo -e '${SAMBA_PASSWORD}\n${SAMBA_PASSWORD}' | smbpasswd -a -s vansh &&
        smbd -F
      "
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SAMBA_PASSWORD=${SAMBA_PASSWORD:?SAMBA_PASSWORD must be set}
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "pgrep", "smbd"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=false"


  syncthing:
    image: syncthing/syncthing:2.1.1
    container_name: syncthing
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8384:8384"
      - "100.64.0.1:22000:22000/tcp"
    volumes:
      - syncthing_data:/var/syncthing
      - /mnt/nas/sync:/data/sync:rw
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8384/rest/noauth/health"]
      interval: 60s
      timeout: 10s
      retries: 3
